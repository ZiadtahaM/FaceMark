<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FaceMark - Manual Roster</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060913; --bg-surface: rgba(15, 23, 42, 0.72); --border-subtle: rgba(255, 255, 255, 0.08);
            --primary-cyan: #06b6d4; --text-primary: #f8fafc; --text-secondary: #94a3b8;
            --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif; --font-body: 'Inter', system-ui, sans-serif;
        }
        body { background-color: var(--bg-base); color: var(--text-primary); font-family: var(--font-body); }
        .ambient-glow { position: fixed; filter: blur(120px); border-radius: 50%; z-index: -1; pointer-events: none; opacity: 0.35; }
        .glow-1 { top: -100px; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, #4f46e5 0%, transparent 70%); }
        .sidebar { background: rgba(6, 9, 19, 0.85); backdrop-filter: blur(20px); border-right: 1px solid var(--border-subtle); min-height: 100vh; padding: 24px; }
        .brand-logo { font-family: var(--font-heading); font-weight: 800; font-size: 1.4rem; color: #fff; margin-bottom: 32px; display: flex; align-items: center; gap: 10px; }
        .brand-logo i { color: #06b6d4; }
        .nav-link { color: var(--text-secondary); font-weight: 500; font-size: 0.95rem; padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
        .nav-link:hover, .nav-link.active { color: #fff; background: rgba(99, 102, 241, 0.15); border-left: 3px solid #6366f1; }
        .dashboard-content { padding: 32px 40px; }
        .glass-panel { background: var(--bg-surface); backdrop-filter: blur(16px); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 24px; }
        .table { color: var(--text-primary); margin-top: 16px; }
        .table th { border-bottom: 1px solid var(--border-subtle); background: transparent; font-family: var(--font-heading); font-weight: 600; color: var(--text-secondary); }
        .table td { border-bottom: 1px solid rgba(255,255,255,0.02); background: transparent; vertical-align: middle; }
        .btn-custom { background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4); color: #818cf8; border-radius: 8px; padding: 6px 12px; font-weight: 600; transition: all 0.2s; }
        .btn-custom:hover { background: #6366f1; color: #fff; }
        .form-select { background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-subtle); color: #fff; border-radius: 12px; padding: 10px 16px; }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar d-none d-md-block">
                <div class="brand-logo"><i class="fas fa-fingerprint"></i> FaceMark</div>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item"><a class="nav-link" href="staffdashboard.html"><i class="fas fa-border-all"></i> Command Center</a></li>
                    <li class="nav-item"><a class="nav-link" href="face-capture.html"><i class="fas fa-camera"></i> Live Scanner</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="fas fa-clipboard-list"></i> Manual Roster</a></li>
                    <li class="nav-item mt-4"><a class="nav-link text-danger" href="../Sign in/index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </div>
            <div class="col-md-9 col-lg-10 dashboard-content">
                <h1 style="font-family: var(--font-heading); font-weight: 800; margin-bottom: 32px;">Manual Roster Control</h1>
                <div class="glass-panel">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <select class="form-select w-25" id="courseSelect">
                            <option value="">Select Target Course...</option>
                        </select>
                        <button class="btn btn-custom" onclick="loadRoster()"><i class="fas fa-sync"></i> Refresh</button>
                    </div>
                    <table class="table table-hover">
                        <thead><tr><th>Student ID</th><th>Name</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody id="rosterBody">
                            <tr><td colspan="4" class="text-center text-muted py-4">Select a course to view roster.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if(!window.FaceMarkAPI.getToken()) return window.location.href = '../Sign in/index.html';
            const res = await window.FaceMarkAPI.authFetch('/courses');
            const courses = await res.json();
            const sel = document.getElementById('courseSelect');
            (courses.data || courses).forEach(c => sel.innerHTML += `<option value="${c.id}">${c.name}</option>`);
        });

        async function loadRoster() {
            const courseId = document.getElementById('courseSelect').value;
            const body = document.getElementById('rosterBody');
            if(!courseId) return;
            
            body.innerHTML = '<tr><td colspan="4" class="text-center py-4"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';
            try {
                // Simulated fetch since Nest API depends on relations
                const res = await window.FaceMarkAPI.authFetch(`/courses`);
                const data = await res.json();
                const target = (data.data || data).find(c => c.id == courseId);
                
                body.innerHTML = '';
                if(!target || !target.students || target.students.length === 0) {
                    body.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No students enrolled.</td></tr>';
                    return;
                }
                
                target.students.forEach(s => {
                    body.innerHTML += `
                        <tr>
                            <td>${s.id}</td>
                            <td>${s.firstName} ${s.lastName}</td>
                            <td><span class="badge bg-secondary">Unmarked</span></td>
                            <td><button class="btn-custom" onclick="markPresent(${s.id}, ${courseId})">Mark Present</button></td>
                        </tr>
                    `;
                });
            } catch(e) { body.innerHTML = '<tr><td colspan="4" class="text-danger text-center">Failed to load roster.</td></tr>'; }
        }

        async function markPresent(stdId, crsId) {
            try {
                await window.FaceMarkAPI.authFetch('/attendance/manual', {
                    method: 'POST', body: JSON.stringify({ studentId: stdId, courseId: crsId, status: 'Present' })
                });
                if(window.FaceMarkToast) window.FaceMarkToast.success("Attendance marked manually.");
                loadRoster();
            } catch(e) {
                if(window.FaceMarkToast) window.FaceMarkToast.error("Failed to mark attendance.");
            }
        }
    </script>
</body>
</html>
