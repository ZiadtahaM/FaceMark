<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FaceMark - Live Biometric Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #060913;
            --bg-surface: rgba(15, 23, 42, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --primary-cyan: #06b6d4;
            --text-primary: #f8fafc;
            --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-body);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            margin: 0; position: relative; overflow: hidden;
        }

        /* Ambient Glows */
        .ambient-glow { position: fixed; filter: blur(120px); border-radius: 50%; z-index: -1; pointer-events: none; opacity: 0.25; }
        .glow-1 { top: -100px; left: -100px; width: 500px; height: 500px; background: radial-gradient(circle, #06b6d4 0%, transparent 70%); }
        .glow-2 { bottom: -100px; right: -100px; width: 500px; height: 500px; background: radial-gradient(circle, #818cf8 0%, transparent 70%); }

        .back-nav { position: absolute; top: 30px; left: 30px; z-index: 10; color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
        .back-nav:hover { color: #fff; }

        /* Scanner Frame */
        .scanner-container {
            width: 100%; max-width: 850px; background: var(--bg-surface);
            backdrop-filter: blur(24px); border: 1px solid var(--border-subtle);
            border-radius: 32px; padding: 40px; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8), 0 0 30px rgba(6, 182, 212, 0.1);
            text-align: center;
        }

        .scanner-title { font-family: var(--font-heading); font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; }
        .scanner-subtitle { color: #94a3b8; margin-bottom: 32px; }

        /* Video Feed */
        .video-wrapper {
            position: relative; width: 100%; max-width: 640px; margin: 0 auto 30px;
            aspect-ratio: 4/3; background: #000; border-radius: 20px; overflow: hidden;
            border: 2px solid rgba(6, 182, 212, 0.3); box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        #videoElement { width: 100%; height: 100%; object-fit: cover; }

        /* Radar Overlay */
        .radar-sweep {
            position: absolute; top: 0; left: 0; width: 100%; height: 30%;
            background: linear-gradient(to bottom, transparent, rgba(6, 182, 212, 0.4));
            border-bottom: 2px solid rgba(6, 182, 212, 0.8);
            animation: sweep 3.5s linear infinite; z-index: 5; pointer-events: none; display: none;
        }

        @keyframes sweep { 0% { top: -30%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        .corner-guide { position: absolute; width: 40px; height: 40px; border: 4px solid rgba(6, 182, 212, 0.6); border-radius: 8px; z-index: 6; }
        .tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* Controls */
        .controls { display: flex; justify-content: center; gap: 20px; align-items: center; }

        .control-group { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
        .control-group label { font-size: 0.8rem; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        .form-select { background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-subtle); color: #fff; padding: 12px 16px; border-radius: 12px; }
        .form-select:focus { border-color: var(--primary-cyan); box-shadow: none; }

        .btn-capture {
            background: linear-gradient(135deg, #06b6d4, #3b82f6); color: #fff; border: none;
            padding: 14px 32px; border-radius: 16px; font-family: var(--font-heading); font-size: 1.1rem; font-weight: 700;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            display: flex; align-items: center; gap: 10px;
        }
        .btn-capture:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -5px rgba(6, 182, 212, 0.5); color: #fff; }

        .status-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(16, 185, 129, 0.15); color: #34d399; padding: 6px 14px;
            border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-top: 20px; opacity: 0; transition: opacity 0.3s;
        }

    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <a href="staffdashboard.html" class="back-nav"><i class="fas fa-arrow-left"></i> Back to Command Center</a>

    <div class="scanner-container">
        <h1 class="scanner-title">Live Biometric Scanning</h1>
        <p class="scanner-subtitle">Align face within the targeting brackets. AI engine will process vectors in sub-200ms.</p>

        <div class="video-wrapper">
            <video id="videoElement" autoplay playsinline muted></video>
            <div class="radar-sweep" id="radar"></div>
            <div class="corner-guide tl"></div>
            <div class="corner-guide tr"></div>
            <div class="corner-guide bl"></div>
            <div class="corner-guide br"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="courseSelect">Target Course</label>
                <select id="courseSelect" class="form-select">
                    <option value="">Loading courses...</option>
                </select>
            </div>
            
            <button class="btn-capture" id="captureBtn" style="margin-top: 24px;">
                <i class="fas fa-expand-alt"></i> Execute Scan
            </button>
        </div>
        
        <div class="status-badge" id="matchStatus">
            <i class="fas fa-check-circle"></i> <span>Match Confirmed</span>
        </div>
    </div>

    <!-- Hidden Canvas for frame extraction -->
    <canvas id="canvasElement" style="display:none;"></canvas>

    <script src="../js/api.js"></script>
    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const captureBtn = document.getElementById('captureBtn');
        const courseSelect = document.getElementById('courseSelect');
        const radar = document.getElementById('radar');
        const matchStatus = document.getElementById('matchStatus');

        // Access Camera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
            } catch (err) {
                console.error("Camera error:", err);
                if(window.FaceMarkToast) window.FaceMarkToast.error("Camera access denied or unavailable.");
            }
        }

        // Load Staff Courses
        async function loadCourses() {
            try {
                const res = await window.FaceMarkAPI.authFetch('/courses');
                const courses = await res.json();
                courseSelect.innerHTML = '<option value="">Select a course...</option>';
                (courses.data || courses).forEach(c => {
                    courseSelect.innerHTML += `<option value="${c.id}">${window.escapeHtml(c.name)}</option>`;
                });
            } catch (err) {
                console.error("Failed to load courses:", err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(!window.FaceMarkAPI.getToken()) {
                window.location.href = '../Sign in/index.html';
                return;
            }
            initCamera();
            loadCourses();
        });

        // Capture & Recognize
        captureBtn.addEventListener('click', async () => {
            const courseId = courseSelect.value;
            if(!courseId) {
                if(window.FaceMarkToast) window.FaceMarkToast.warning("Please select a target course first.");
                return;
            }

            // Visual feedback
            radar.style.display = 'block';
            captureBtn.disabled = true;
            captureBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            matchStatus.style.opacity = 0;

            // Extract Frame
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const b64Image = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];

            try {
                // Post to API backend (which calls AI service & records in DB)
                const res = await window.FaceMarkAPI.authFetch('/attendance/ai/record', {
                    method: 'POST',
                    body: JSON.stringify({
                        courseId: parseInt(courseId),
                        imageBase64: b64Image
                    })
                });
                
                const result = await res.json();

                if(!res.ok) {
                    throw new Error(result.message || 'Recognition failed.');
                }

                if(result.data && result.data.status === 'MATCH') {
                    if(window.FaceMarkToast) window.FaceMarkToast.success(`Match Verified! Student ID: ${result.data.studentId} marked present.`);
                    matchStatus.innerHTML = `<i class="fas fa-check-circle"></i> <span>Match Confirmed: ${result.data.studentId}</span>`;
                    matchStatus.style.color = '#34d399';
                    matchStatus.style.background = 'rgba(16, 185, 129, 0.15)';
                    matchStatus.style.opacity = 1;
                    
                    // Success sound (optional synthetic beep)
                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = audioCtx.createOscillator();
                        osc.connect(audioCtx.destination);
                        osc.frequency.value = 800; osc.type = 'sine'; osc.start(); setTimeout(() => osc.stop(), 150);
                    } catch(e) {}
                } else {
                    if(window.FaceMarkToast) window.FaceMarkToast.error("No facial match found in DB.");
                    matchStatus.innerHTML = `<i class="fas fa-times-circle"></i> <span>No Match Found</span>`;
                    matchStatus.style.color = '#f43f5e';
                    matchStatus.style.background = 'rgba(244, 63, 94, 0.15)';
                    matchStatus.style.opacity = 1;
                }

            } catch (err) {
                console.error("Capture Error:", err);
                if(window.FaceMarkToast) window.FaceMarkToast.error(err.message || "Network timeout or AI service unavailable.");
            } finally {
                radar.style.display = 'none';
                captureBtn.disabled = false;
                captureBtn.innerHTML = '<i class="fas fa-expand-alt"></i> Execute Scan';
            }
        });
    </script>
</body>
</html>
