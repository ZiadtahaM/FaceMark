<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FaceMark - Staff Command Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #060913;
            --bg-surface: rgba(15, 23, 42, 0.72);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --primary-indigo: #6366f1;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-body);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Ambient Glows */
        .ambient-glow {
            position: fixed; filter: blur(120px); border-radius: 50%; z-index: -1; pointer-events: none; opacity: 0.35;
        }
        .glow-1 { top: -100px; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, #4f46e5 0%, transparent 70%); }
        .glow-2 { bottom: -100px; right: -100px; width: 500px; height: 500px; background: radial-gradient(circle, #06b6d4 0%, transparent 70%); }

        /* Sidebar */
        .sidebar {
            background: rgba(6, 9, 19, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-subtle);
            min-height: 100vh;
            padding: 24px;
        }
        
        .brand-logo {
            font-family: var(--font-heading);
            font-weight: 800; font-size: 1.4rem; color: #fff;
            margin-bottom: 32px; display: flex; align-items: center; gap: 10px;
        }
        .brand-logo i { color: #06b6d4; }

        .user-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 16px; padding: 16px; margin-bottom: 24px;
        }
        .user-box small { color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
        .user-name { font-family: var(--font-heading); font-size: 1.1rem; font-weight: 700; color: #fff; margin-top: 4px; }

        .nav-link {
            color: var(--text-secondary); font-weight: 500; font-size: 0.95rem;
            padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; transition: all 0.2s;
            display: flex; align-items: center; gap: 12px;
        }
        .nav-link i { font-size: 1.1rem; width: 24px; text-align: center; }
        .nav-link:hover, .nav-link.active {
            color: #fff; background: rgba(99, 102, 241, 0.15); border-left: 3px solid var(--primary-indigo);
        }

        /* Stat Cards */
        .dashboard-content { padding: 32px 40px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .dashboard-header h1 { font-family: var(--font-heading); font-size: 2rem; font-weight: 800; }
        
        .stat-card {
            background: var(--bg-surface); backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle); border-radius: 20px;
            padding: 24px; display: flex; justify-content: space-between; align-items: flex-start;
        }
        .stat-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
        .stat-blue { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
        .stat-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .stat-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        
        .stat-card h6 { color: var(--text-secondary); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-top: 12px; margin-bottom: 4px; }
        .stat-card h2 { font-family: var(--font-heading); font-size: 2.2rem; font-weight: 800; margin: 0; }

        /* Modern Table & Cards */
        .glass-panel {
            background: var(--bg-surface); backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle); border-radius: 20px; padding: 24px; margin-top: 24px;
        }
        .glass-panel h5 { font-family: var(--font-heading); font-weight: 700; margin-bottom: 20px; }

        .course-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-subtle);
            border-radius: 16px; padding: 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .course-info h6 { font-family: var(--font-heading); font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
        .course-info small { color: var(--text-secondary); font-size: 0.85rem; }
        .course-badge { background: rgba(99, 102, 241, 0.15); color: #818cf8; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }

        .btn-launch { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: transform 0.2s; }
        .btn-launch:hover { transform: translateY(-2px); color: #fff; }

        @media(max-width:768px) {
            .dashboard-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container-fluid">
        <div class="row">
            
            <!-- Mobile Toggle -->
            <button class="btn btn-dark d-md-none m-3" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" style="width: auto; background: var(--primary-indigo); border: none;">
                <i class="fas fa-bars"></i>
            </button>

            <!-- Sidebar -->
            <div class="offcanvas-md offcanvas-start col-md-3 col-lg-2 sidebar" tabindex="-1" id="sidebarMenu">
                <div class="brand-logo">
                    <i class="fas fa-fingerprint"></i> FaceMark
                </div>

                <div class="user-box">
                    <small>Staff Portal</small>
                    <div class="user-name" id="usernameDisplay">Loading...</div>
                </div>

                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="fas fa-border-all"></i> Command Center</a></li>
                    <li class="nav-item"><a class="nav-link" href="face-capture.html"><i class="fas fa-camera"></i> Live Scanner</a></li>
                    <li class="nav-item"><a class="nav-link" href="manualattendance.html"><i class="fas fa-clipboard-list"></i> Manual Roster</a></li>
                    <li class="nav-item"><a class="nav-link" href="charts.html"><i class="fas fa-chart-pie"></i> Analytics</a></li>
                    <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Secure Logout</a></li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 dashboard-content">
                <div class="dashboard-header">
                    <h1>Command Center</h1>
                    <a href="face-capture.html" class="btn-launch"><i class="fas fa-satellite-dish"></i> Launch Biometric Scanner</a>
                </div>

                <!-- Stats Grid -->
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div>
                                <div class="stat-icon stat-blue"><i class="fas fa-book"></i></div>
                                <h6>Active Courses</h6>
                                <h2 id="totalCourses">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div>
                                <div class="stat-icon stat-green"><i class="fas fa-users"></i></div>
                                <h6>Total Students Enrolled</h6>
                                <h2 id="totalStudents">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div>
                                <div class="stat-icon stat-purple"><i class="fas fa-shield-alt"></i></div>
                                <h6>Storage Engine Health</h6>
                                <h2>100%</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Active Classes Roster -->
                <div class="row">
                    <div class="col-12">
                        <div class="glass-panel">
                            <h5>Your Assigned Courses</h5>
                            <div id="coursesContainer">
                                <div class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i> Loading secured data...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('username') || 'Staff Member';
            document.getElementById('usernameDisplay').textContent = window.escapeHtml(user);
            
            // Check session
            if(!window.FaceMarkAPI.getToken()) {
                window.location.href = '../Sign in/index.html';
                return;
            }
            
            loadCourses();
        });

        async function loadCourses() {
            try {
                const res = await window.FaceMarkAPI.authFetch('/courses');
                const result = await res.json();
                
                const courses = result.data || result;
                const container = document.getElementById("coursesContainer");
                container.innerHTML = "";

                if(courses.length === 0) {
                    container.innerHTML = `<p class="text-muted">No courses assigned to you.</p>`;
                    return;
                }

                let totalStds = 0;
                courses.forEach(c => {
                    const count = c.students ? c.students.length : 0;
                    totalStds += count;
                    container.innerHTML += `
                        <div class="course-card">
                            <div class="course-info">
                                <h6>${window.escapeHtml(c.name)}</h6>
                                <small><i class="fas fa-clock"></i> ${window.escapeHtml(c.schedule || "TBD")} &middot; <i class="fas fa-door-open"></i> ${window.escapeHtml(c.room || "TBD")}</small>
                            </div>
                            <div class="course-badge">${count} Students</div>
                        </div>
                    `;
                });

                document.getElementById('totalCourses').textContent = courses.length;
                document.getElementById('totalStudents').textContent = totalStds;
                
            } catch (err) {
                console.error("Failed to load courses:", err);
                document.getElementById("coursesContainer").innerHTML = `<p class="text-danger"><i class="fas fa-exclamation-triangle"></i> Failed to securely load courses.</p>`;
                if(window.FaceMarkToast) window.FaceMarkToast.error("Failed to fetch assigned courses.");
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../Sign in/index.html';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
