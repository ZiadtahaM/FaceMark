<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FaceMark - Analytics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-base: #060913; --bg-surface: rgba(15, 23, 42, 0.72); --border-subtle: rgba(255, 255, 255, 0.08);
            --primary-purple: #a855f7; --text-primary: #f8fafc; --text-secondary: #94a3b8;
            --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif; --font-body: 'Inter', system-ui, sans-serif;
        }
        body { background-color: var(--bg-base); color: var(--text-primary); font-family: var(--font-body); }
        .sidebar { background: rgba(6, 9, 19, 0.85); backdrop-filter: blur(20px); border-right: 1px solid var(--border-subtle); min-height: 100vh; padding: 24px; }
        .brand-logo { font-family: var(--font-heading); font-weight: 800; font-size: 1.4rem; color: #fff; margin-bottom: 32px; display: flex; align-items: center; gap: 10px; }
        .brand-logo i { color: #06b6d4; }
        .nav-link { color: var(--text-secondary); font-weight: 500; font-size: 0.95rem; padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
        .nav-link:hover, .nav-link.active { color: #fff; background: rgba(168, 85, 247, 0.15); border-left: 3px solid var(--primary-purple); }
        .dashboard-content { padding: 32px 40px; }
        .glass-panel { background: var(--bg-surface); backdrop-filter: blur(16px); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 24px; margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar d-none d-md-block">
                <div class="brand-logo"><i class="fas fa-fingerprint"></i> FaceMark</div>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item"><a class="nav-link" href="staffdashboard.html"><i class="fas fa-border-all"></i> Command Center</a></li>
                    <li class="nav-item"><a class="nav-link" href="face-capture.html"><i class="fas fa-camera"></i> Live Scanner</a></li>
                    <li class="nav-item"><a class="nav-link" href="manualattendance.html"><i class="fas fa-clipboard-list"></i> Manual Roster</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="fas fa-chart-pie"></i> Analytics</a></li>
                    <li class="nav-item mt-4"><a class="nav-link text-danger" href="../Sign in/index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </div>
            <div class="col-md-9 col-lg-10 dashboard-content">
                <h1 style="font-family: var(--font-heading); font-weight: 800; margin-bottom: 32px;">System Analytics</h1>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="glass-panel">
                            <h5 style="font-family: var(--font-heading); margin-bottom: 20px;">Storage Engine Distribution</h5>
                            <canvas id="engineChart"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="glass-panel">
                            <h5 style="font-family: var(--font-heading); margin-bottom: 20px;">AI Verification Speed (ms)</h5>
                            <canvas id="latencyChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Mock data visualizing the DDIA improvements
        const ctx1 = document.getElementById('engineChart').getContext('2d');
        new Chart(ctx1, {
            type: 'doughnut',
            data: {
                labels: ['Bitcask WAL', 'Legacy Pickle (Deprecated)'],
                datasets: [{
                    data: [98, 2],
                    backgroundColor: ['#10b981', '#f43f5e'],
                    borderColor: 'rgba(15, 23, 42, 1)',
                    borderWidth: 2
                }]
            },
            options: { plugins: { legend: { labels: { color: '#f8fafc' } } } }
        });

        const ctx2 = document.getElementById('latencyChart').getContext('2d');
        new Chart(ctx2, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
                datasets: [{
                    label: 'P99 Latency (ms)',
                    data: [180, 165, 170, 150, 145],
                    borderColor: '#a855f7',
                    backgroundColor: 'rgba(168, 85, 247, 0.2)',
                    fill: true, tension: 0.4
                }]
            },
            options: { scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } }, plugins: { legend: { labels: { color: '#f8fafc' } } } }
        });
    </script>
</body>
</html>
