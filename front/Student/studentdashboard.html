<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FaceMark - Student Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #060913;
            --bg-surface: rgba(15, 23, 42, 0.72);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --primary-cyan: #06b6d4;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-body);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Ambient Glows */
        .ambient-glow { position: fixed; filter: blur(120px); border-radius: 50%; z-index: -1; pointer-events: none; opacity: 0.35; }
        .glow-1 { top: -100px; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, #a855f7 0%, transparent 70%); }
        .glow-2 { bottom: -100px; right: -100px; width: 500px; height: 500px; background: radial-gradient(circle, #06b6d4 0%, transparent 70%); }

        /* Sidebar */
        .sidebar {
            background: rgba(6, 9, 19, 0.85); backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-subtle); min-height: 100vh; padding: 24px;
        }
        
        .brand-logo { font-family: var(--font-heading); font-weight: 800; font-size: 1.4rem; color: #fff; margin-bottom: 32px; display: flex; align-items: center; gap: 10px; }
        .brand-logo i { color: var(--primary-cyan); }

        .user-box { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 16px; margin-bottom: 24px; }
        .user-box small { color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
        .user-name { font-family: var(--font-heading); font-size: 1.1rem; font-weight: 700; color: #fff; margin-top: 4px; }

        .nav-link { color: var(--text-secondary); font-weight: 500; font-size: 0.95rem; padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
        .nav-link i { font-size: 1.1rem; width: 24px; text-align: center; }
        .nav-link:hover, .nav-link.active { color: #fff; background: rgba(6, 182, 212, 0.15); border-left: 3px solid var(--primary-cyan); }

        /* Content */
        .dashboard-content { padding: 32px 40px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .dashboard-header h1 { font-family: var(--font-heading); font-size: 2rem; font-weight: 800; }

        .glass-panel { background: var(--bg-surface); backdrop-filter: blur(16px); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 24px; margin-bottom: 24px; }
        .glass-panel h5 { font-family: var(--font-heading); font-weight: 700; margin-bottom: 20px; }

        .record-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-subtle);
            border-radius: 16px; padding: 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;
            transition: transform 0.2s, background 0.2s; cursor: pointer;
        }
        .record-card:hover {
            transform: translateY(-2px); background: rgba(255, 255, 255, 0.05); border-color: rgba(6, 182, 212, 0.4);
        }
        .record-info h6 { font-family: var(--font-heading); font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
        .record-info small { color: var(--text-secondary); font-size: 0.85rem; }
        .status-badge { background: rgba(16, 185, 129, 0.15); color: #34d399; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }

        .face-status { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 24px; text-align: center; }
        .face-status i { font-size: 3rem; color: #34d399; margin-bottom: 16px; }
        .face-status h4 { font-family: var(--font-heading); font-weight: 700; }
        .face-status p { color: var(--text-secondary); font-size: 0.9rem; }

        @media(max-width:768px) { .dashboard-content { padding: 20px; } }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container-fluid">
        <div class="row">
            
            <button class="btn d-md-none m-3 text-white" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" style="width: auto; background: var(--primary-cyan); border: none;">
                <i class="fas fa-bars"></i>
            </button>

            <!-- Sidebar -->
            <div class="offcanvas-md offcanvas-start col-md-3 col-lg-2 sidebar" tabindex="-1" id="sidebarMenu">
                <div class="brand-logo"><i class="fas fa-fingerprint"></i> FaceMark</div>

                <div class="user-box">
                    <small>Student Portal</small>
                    <div class="user-name" id="usernameDisplay">Loading...</div>
                </div>

                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="fas fa-chart-line"></i> My Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-book"></i> Courses</a></li>
                    <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Secure Logout</a></li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 dashboard-content">
                <div class="dashboard-header">
                    <h1>My Attendance</h1>
                </div>

                <div class="row">
                    <div class="col-md-8">
                        <div class="glass-panel">
                            <h5>Recent Records</h5>
                            <div id="attendanceContainer">
                                <div class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i> Fetching records securely...</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="face-status">
                            <i class="fas fa-user-check"></i>
                            <h4>Biometrics Active</h4>
                            <p>Your facial vector embeddings are securely stored in our Bitcask WAL engine.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('username') || 'Student';
            document.getElementById('usernameDisplay').textContent = window.escapeHtml(user);
            
            if(!window.FaceMarkAPI.getToken()) {
                window.location.href = '../Sign in/index.html';
                return;
            }
            
            loadAttendance();
        });

        async function loadAttendance() {
            try {
                // Endpoint assumed to exist on backend based on user role
                const res = await window.FaceMarkAPI.authFetch('/attendance/my-records');
                const result = await res.json();
                
                const records = result.data || result;
                const container = document.getElementById("attendanceContainer");
                container.innerHTML = "";

                if(records.length === 0) {
                    container.innerHTML = `<p class="text-muted">No attendance records found yet.</p>`;
                    return;
                }

                records.forEach(r => {
                    const date = new Date(r.timestamp).toLocaleString();
                    container.innerHTML += `
                        <div class="record-card">
                            <div class="record-info">
                                <h6>Course ID: ${r.courseId}</h6>
                                <small><i class="fas fa-calendar-alt"></i> ${date}</small>
                            </div>
                            <div class="status-badge"><i class="fas fa-check"></i> Present</div>
                        </div>
                    `;
                });
                
            } catch (err) {
                console.error("Failed to load attendance:", err);
                document.getElementById("attendanceContainer").innerHTML = `<p class="text-danger">Failed to fetch data.</p>`;
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../Sign in/index.html';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
