<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceMark - Search System</title>
    <link rel="stylesheet" href="search-admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../../Responsive/responsive.css">
</head>
<body class="dark-mode">
    <button class="mobile-menu-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="resizer" id="sidebarResizer"></div> 
            <div class="brand">
                <img src="../../../images/face.jpeg" alt="FaceMark Logo" class="brand-logo">
                <div class="brand-text">
                    <h2>Face<span>Mark</span></h2>
                    <p>Intelligent Attendance</p>
                </div>
            </div>
            
            <div class="user-profile">
                <p class="welcome-text">Welcome,</p>
                <h3 id="adminName">Loading...</h3> 
                <p class="user-role">Admin Portal</p>
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard-index.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="courses-admin-index.html"><i class="fas fa-book"></i> Courses</a></li>
                    <li><a href="manual-attend-admin-index.html"><i class="fas fa-user-check"></i> Manual Attendance</a></li>
                    <li><a href="reports-admin-index.html"><i class="fas fa-file-alt"></i> Reports</a></li>
                    <li class="active"><a href="#"><i class="fas fa-search"></i> Search</a></li>
                    <li><a href="alerts-admin-index.html"><i class="fas fa-bell"></i> Alerts</a></li>
                    <li><a href="manage-account-admin-index.html"><i class="fas fa-users-cog"></i> Manage Accounts</a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <a href="javascript:void(0)" class="sign-out-link" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> 
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-wrapper">
                
                <div class="search-section-card">
                    <h2 class="section-title">Search System</h2>
                    <div class="search-bar-container">
                        <input type="text" id="searchInput" placeholder="Search by name, ID, or email..." class="search-input">
                        <button class="btn-search" onclick="performSearch()">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>

                    <div class="filters-grid">
                        <div class="filter-group">
                            <label>Search Type</label>
                            <select id="searchType">
                                <option value="student">Students</option>
                                <option value="instructor">Instructors</option>
                                <option value="admin">Admins</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Filter By Course</label>
                            <select id="filterCourse">
                                <option value="all">All Courses</option>
                                </select>
                        </div>
                        <div class="filter-group">
                            <label>Sort By</label>
                            <select id="sortBy">
                                <option value="name_asc">Name (A-Z)</option>
                                <option value="name_desc">Name (Z-A)</option>
                                <option value="recent">Recently Added</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="results-section-card">
                    <div class="results-header">
                        <h3 class="section-subtitle">Search Results</h3>
                        <span id="resultsCount" class="results-count"></span>
                    </div>
                    
                    <div id="searchResultsContainer" class="results-container">
                        <div class="empty-results">
                            <i class="fas fa-search-plus" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i>
                            <p>Enter a search query to view results from the system</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <div id="userModal" class="modal-overlay" style="display: none;">
        <div class="details-popup-large">
            <div class="popup-header">
                <h3>User Details</h3>
                <span class="close-popup" onclick="closeModal()">&times;</span>
            </div>
            <div id="userDetailsContent" class="popup-body">
                </div>
        </div>
    </div>

    <script src="search-admin-script.js"></script>
</body>
</html>
