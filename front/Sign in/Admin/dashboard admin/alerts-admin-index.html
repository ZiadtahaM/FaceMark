<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceMark - System Alerts</title>
    <link rel="stylesheet" href="alerts-admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../../Responsive/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="dark-mode">
    <button class="mobile-menu-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>
    
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="resizer"></div> 
            <div class="brand">
                <img src="../../../images/face.jpeg" alt="FaceMark Logo" class="brand-logo">
                <div class="brand-text">
                    <h2>Face<span>Mark</span></h2>
                    <p>Intelligent Attendance</p>
                </div>
            </div>
            <div class="user-profile">
                <p class="welcome-text">Welcome,</p>
                <h3 id="adminName">Aya_allah</h3> 
                <p class="user-role">Admin Portal</p>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard-index.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="courses-admin-index.html"><i class="fas fa-book"></i> Courses</a></li>
                    <li><a href="manual-attend-admin-index.html"><i class="fas fa-user-check"></i> Manual Attendance</a></li>
                    <li><a href="reports-admin-index.html"><i class="fas fa-file-alt"></i> Reports</a></li>
                    <li><a href="search-admin-index.html"><i class="fas fa-search"></i> Search</a></li>
                    <li class="active"><a href="alerts-admin-index.html"><i class="fas fa-bell"></i> Alerts</a></li>
                    <li><a href="manage-account-admin-index.html"><i class="fas fa-users-cog"></i> Manage Accounts</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="../../index.html" id="signOutBtn" class="sign-out-link" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> 
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-wrapper">
                
                <div class="alerts-section-card">
                    <div class="section-header-flex">
                        <h2 class="section-title">System Alerts</h2>
                        <button class="btn-clear" id="clearAllBtn">Clear All Notifications</button>
                    </div>

                    <div class="alerts-list" id="alertsContainer">
                        </div>
                    
                    <div id="noAlertsMsg" style="display: none; text-align: center; color: #888; padding: 40px;">
                        <i class="fas fa-check-circle" style="display: block; font-size: 2rem; margin-bottom: 10px;"></i>
                        No new notifications
                    </div>
                </div>

                <div class="broadcast-section-card">
                    <h3 class="section-subtitle">Broadcast Alert</h3>
                    
                    <div class="form-group">
                        <label for="alertType">Alert Type</label>
                        <select id="alertType">
                            <option value="information">Information</option>
                            <option value="warning">Warning</option>
                            <option value="important">Important</option>
                            <option value="emergency">Emergency</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="recipients">Recipients</label>
                        <select id="recipients">
                            <option value="all">All Users</option>
                            <option value="students">Students Only</option>
                            <option value="staff">Staff Only</option>
                            <option value="course">Specific Course</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="broadcastMsg">Message</label>
                        <textarea id="broadcastMsg" placeholder="Type your message here..." rows="4"></textarea>
                    </div>

                    <button class="btn-send" id="sendAlertBtn">Send Alert</button>
                </div>

            </div>
        </main>
    </div>

    <script src="alerts-admin-script.js"></script>
</body>
</html>
